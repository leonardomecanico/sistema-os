<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marlift Service OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">OS</div>
        <div class="logo-text">
          <h1>Marlift Service</h1>
          <span>Ordem de Serviço</span>
        </div>
      </div>
    </div>
  </header>

  <main class="app visible">
    <section id="cadastro">
      <h2>Cadastrar Cliente</h2>
      <form id="formCliente">
        <input type="text" id="nomeCliente" placeholder="Nome do Cliente" required>
        <textarea id="equipamentosCliente" placeholder="Equipamentos separados por vírgula"></textarea>
        <button type="submit" class="btn btn-primary">Salvar Cliente</button>
      </form>
    </section>

    <section id="agendamento">
      <h2>Agendar Atendimento</h2>
      <form id="formAgendamento">
        <select id="clienteSelect"></select>
        <input type="date" id="dataAgendamento" required>
        <input type="time" id="horaAgendamento" required>
        <button type="submit" class="btn btn-primary">Salvar Agendamento</button>
      </form>
      <div id="calendario"></div>
    </section>

    <section id="novaOS">
      <h2>Abrir Nova OS</h2>
      <form id="formOS">
        <select id="clienteOS"></select>
        <select id="equipamentoOS"></select>
        <input type="time" id="horaInicio" required>
        <input type="time" id="horaPausa">
        <input type="time" id="horaFim" required>
        <textarea id="descricaoServico" placeholder="Descrição do serviço"></textarea>
        <button type="submit" class="btn btn-success">Gerar PDF</button>
      </form>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
